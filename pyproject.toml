[project]
name = "whatsapp-rag"
version = "0.1.0"
description = "Vector memory over WhatsApp DM history: decrypt, parse, chunk, embed, sqlite-vec search."
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "numpy>=1.26",
    "sqlite-vec>=0.1.9",
    "personal-api",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
decrypt = ["wa-crypt-tools"]

[project.scripts]
wa-rag = "whatsapp_rag.cli:main"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
personal-api = { path = "../HPI", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whatsapp_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
